<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | ARTfunny</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .contact-form {
      background: #222;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 2rem;
      max-width: 520px;
      margin: 1.5rem auto;
    }
    .contact-form label {
      display: block;
      margin-bottom: 0.35rem;
      color: #e2e8f0;
      font-weight: 600;
    }
    .contact-form input,
    .contact-form textarea {
      width: 100%;
      padding: 0.75rem 1rem;
      margin-bottom: 1.25rem;
      border: 1px solid #444;
      border-radius: 8px;
      background: #1a1a1a;
      color: #f1f5f9;
      font-size: 1rem;
      font-family: inherit;
    }
    .contact-form input:focus,
    .contact-form textarea:focus {
      outline: none;
      border-color: #22d3ee;
    }
    .contact-form textarea {
      min-height: 140px;
      resize: vertical;
    }
    .contact-form button {
      width: 100%;
      padding: 0.9rem;
      font-size: 1.1rem;
      font-weight: 600;
      background: #22d3ee;
      color: #111;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .contact-form button:hover {
      background: #67e8f9;
    }
    .message-bottle {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .message-bottle img {
      max-height: 140px;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="logo-row">
      <img src="images/ARTFunny3D_logo.png" alt="ARTfunny Logo">
    </div>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="gallery.html">Gallery</a>
      <a href="services.html">Services</a>
      <a href="artoons.html">ARToons</a>
      <a href="animations.html">Animations</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
  </header>

  <main>
    <h1>Contact</h1>
    <p class="text-center">Send a message in a bottle — I’ll get back to you as soon as I can.</p>

    <div class="message-bottle">
      <img src="images/MessageMe.png" alt="Message Me">
    </div>

    <!-- 
      FORMSPREE SETUP (free):
      1. Go to https://formspree.io and create a free account
      2. Create a new form
      3. Copy the form endpoint (looks like https://formspree.io/f/xxxxxxxx)
      4. Replace the action URL below with your endpoint
      5. In Formspree settings → Autoresponder, turn it on and set the message to:
         "SOS Message received! Thanks for contacting ARTfunny – Gary Beaumont"
    -->
    <form class="contact-form" action="https://formspree.io/f/mqpzwdad" method="POST">
      <label for="name">Your Name</label>
      <input type="text" id="name" name="name" required placeholder="Name">

      <label for="email">Your Email</label>
      <input type="email" id="email" name="email" required placeholder="you@example.com">

      <label for="message">Message</label>
      <textarea id="message" name="message" required placeholder="Tell me about your project or idea..."></textarea>

      <!-- This makes Formspree send the reply to you without showing your address on the page -->
      <input type="hidden" name="_subject" value="New message from ARTfunny website">
      
      <button type="submit">Send Message</button>
    </form>

    <p class="text-center" style="margin-top:1.5rem; color:#94a3b8; font-size:0.95rem;">
      Or reach me on X: <a href="https://x.com/artfunny5" target="_blank" rel="noopener">@artfunny5</a>
    </p>
  </main>

  <footer class="site-footer">
    <p>ARTfunny © 2026 · Digital Cartoon Artwork</p>
    <p><a href="https://x.com/artfunny5" target="_blank" rel="noopener">@artfunny5</a></p>
  </footer>
</body>
</html>
